name: iosApp
options:
  bundleIdPrefix: com.yourorg

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosApp
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourorg.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # The top-level `info: path:` YAML key (tried previously, now removed) tells XcodeGen to
        # *generate* a plist from that file rather than reference it directly, and fighting it
        # with GENERATE_INFOPLIST_FILE: NO produced a build using neither — Xcode fell back to a
        # bare synthesized Info.plist with none of this file's keys at all (confirmed by CI's
        # verify step: no CADisableMinimumFrameDurationOnPhone, no CFBundleDisplayName, wrong
        # CFBundleShortVersionString). Setting INFOPLIST_FILE directly as a build setting is what
        # XcodeGen's own docs say won't get overwritten by its generation logic.
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: "iosApp/Info.plist"
        # Lets Xcode's Swift compiler resolve/link ComposeApp.framework at compile time. Actually
        # *embedding* the framework into the built app is handled separately by the
        # embedAndSignAppleFrameworkForXcode Run Script phase below, not by this search path.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework"
        # ComposeApp.framework is arm64-only (no iosX64/Intel-simulator Kotlin target exists — see
        # composeApp/build.gradle.kts), but Xcode's default simulator ARCHS still includes x86_64.
        # Both the framework linking above and the embedAndSignAppleFrameworkForXcode task below
        # would otherwise try to produce/find an x86_64 slice that was never built.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    # A previous attempt statically referenced the prebuilt ComposeApp.framework directly
    # (`dependencies: - framework: ...`, embedding it as-is). That links and runs the Kotlin code
    # fine, but Compose Multiplatform's resource reader looks up images/icons relative to the
    # *app's own* bundle root (NSBundle.mainBundle), not the embedded framework's bundle — so
    # every drawable/resource lookup crashed with MissingResourceException, confirmed live via
    # Appetize (`compose-resources/composeResources/.../ic_play_arrow.xml` not found). Manual
    # framework embedding isn't a supported configuration for Compose resources at all (see
    # JetBrains/compose-multiplatform#3800) — embedAndSignAppleFrameworkForXcode is the officially
    # supported task and is what every JetBrains-generated CMP iOS project actually uses; it copies,
    # code-signs, *and* places compose-resources correctly in one step.
    postCompileScripts:
      - name: Compile Kotlin Framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
