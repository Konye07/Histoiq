name: iosApp
options:
  bundleIdPrefix: com.yourorg

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosApp
        excludes:
          - Info.plist
    info:
      path: iosApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourorg.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # Points at the debug framework linkDebugFrameworkIosSimulatorArm64 already produces —
        # CI runs that Gradle task before `xcodegen generate`/`xcodebuild`, so this only needs to
        # locate the output, not build it itself (no Run Script phase needed for a CI build check).
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework"
        # ComposeApp.framework is arm64-only (no iosX64/Intel-simulator Kotlin target exists — see
        # composeApp/build.gradle.kts), but Xcode's default simulator ARCHS still includes x86_64,
        # so an unconstrained build tries to link an x86_64 slice of ComposeApp that was never
        # built, failing with "found architecture 'arm64', required architecture 'x86_64'" on
        # every object file. Excluding x86_64 for the simulator SDK specifically matches this to
        # what actually gets built.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    dependencies:
      - framework: ../composeApp/build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework
        embed: true
