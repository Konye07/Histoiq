name: iosApp
options:
  bundleIdPrefix: com.konye

packages:
  # Real "Continue with Google" (Core/Auth/GoogleSignInBridge.swift) — Kotlin/Native can't cinterop
  # against an SPM-only package directly, so the actual SDK call lives in Swift; see
  # Core/Platform/IosNativeBridges.kt for why.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.0.0
  # Real AdMob ads (Core/Ads/AdsBridge.swift) — same Swift-bridge reasoning as GoogleSignIn above.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.9.0
  # EEA/UK ad-consent flow (ConsentBridge.swift) — resolves transitively under GoogleMobileAds's own
  # package graph already, but SPM only exposes import-able modules for products declared directly
  # on this target, so it still needs its own packages: + dependencies: entry.
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.1.0

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosApp
        excludes:
          - Info.plist
          - iosApp.entitlements
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.konye.historiq
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: NC29559DJB
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only: an app that also targets iPad must declare all four orientations (or
        # UIRequiresFullScreen) or App Store Connect rejects the upload (ITMS-90474), and this UI is
        # portrait-only.
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # Real Sign in with Apple (Core/Auth/AppleSignIn.ios.kt) needs this capability's entitlement.
        CODE_SIGN_ENTITLEMENTS: "iosApp/iosApp.entitlements"
        # The top-level `info: path:` YAML key (tried previously, now removed) tells XcodeGen to
        # *generate* a plist from that file rather than reference it directly, and fighting it
        # with GENERATE_INFOPLIST_FILE: NO produced a build using neither — Xcode fell back to a
        # bare synthesized Info.plist with none of this file's keys at all (confirmed by CI's
        # verify step: no CADisableMinimumFrameDurationOnPhone, no CFBundleDisplayName, wrong
        # CFBundleShortVersionString). Setting INFOPLIST_FILE directly as a build setting is what
        # XcodeGen's own docs say won't get overwritten by its generation logic.
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: "iosApp/Info.plist"
        # Lets Xcode's Swift compiler resolve/link ComposeApp.framework at compile time. Actually
        # *embedding* the framework into the built app is handled separately by the
        # embedAndSignAppleFrameworkForXcode Run Script phase below, not by this search path.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework"
        # A device build (the archive ios-release.yml makes) links the release framework that
        # workflow builds first; the simulator path above only exists for ci.yml's simulator build.
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/../composeApp/build/bin/iosArm64/releaseFramework"
        # ComposeApp.framework is arm64-only (no iosX64/Intel-simulator Kotlin target exists — see
        # composeApp/build.gradle.kts), but Xcode's default simulator ARCHS still includes x86_64.
        # Both the framework linking above and the embedAndSignAppleFrameworkForXcode task below
        # would otherwise try to produce/find an x86_64 slice that was never built.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
      configs:
        Release:
          # Manual signing: automatic signing has to make a development profile, which needs at
          # least one registered device, and this team has none. The certificate and profile come
          # from scripts/ios-signing.mjs. Set on the target rather than the xcodebuild command line,
          # which would also hit the SwiftPM package targets and fail with "does not support
          # provisioning profiles".
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Historiq App Store"
    # A previous attempt statically referenced the prebuilt ComposeApp.framework directly
    # (`dependencies: - framework: ...`, embedding it as-is). That links and runs the Kotlin code
    # fine, but Compose Multiplatform's resource reader looks up images/icons relative to the
    # *app's own* bundle root (NSBundle.mainBundle), not the embedded framework's bundle — so
    # every drawable/resource lookup crashed with MissingResourceException, confirmed live via
    # Appetize (`compose-resources/composeResources/.../ic_play_arrow.xml` not found). Manual
    # framework embedding isn't a supported configuration for Compose resources at all (see
    # JetBrains/compose-multiplatform#3800) — embedAndSignAppleFrameworkForXcode is the officially
    # supported task and is what every JetBrains-generated CMP iOS project actually uses; it copies,
    # code-signs, *and* places compose-resources correctly in one step.
    postCompileScripts:
      - name: Compile Kotlin Framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
