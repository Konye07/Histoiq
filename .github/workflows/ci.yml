name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  android:
    name: Android build + iOS metadata check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
      - name: composeApp assembleDebug (Android)
        run: ./gradlew :composeApp:assembleDebug --stacktrace
      # Type-checks commonMain against both platforms' expect/actual contracts without needing
      # the Kotlin/Native compiler backend — the one iOS-adjacent check that doesn't need macOS.
      - name: Kotlin metadata compile (iosMain)
        run: ./gradlew :composeApp:compileIosMainKotlinMetadata --stacktrace

  ios:
    name: iOS Kotlin/Native compile + Xcode app build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
      # Real Kotlin/Native compilation for both iOS targets — this is the check that can only
      # run on macOS.
      - name: Link iOS frameworks (arm64 device + Apple Silicon simulator)
        run: |
          ./gradlew :composeApp:linkDebugFrameworkIosArm64 --stacktrace
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iosApp.xcodeproj
        run: xcodegen generate
        working-directory: iosApp
      # GoogleSignIn/GoogleMobileAds (project.yml's `packages:`) need to be fetched before the real
      # build — doing it as its own step gives a clear failure point/log if a package URL or
      # version ever becomes unresolvable, instead of that error being buried inside the build step.
      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project iosApp.xcodeproj -scheme iosApp
        working-directory: iosApp
      # Ground truth for what XcodeGen actually wrote, so a future Info.plist problem can be
      # diagnosed from real resolved build settings instead of guessing at XcodeGen's YAML schema.
      - name: Show resolved INFOPLIST build settings
        run: |
          xcodebuild -showBuildSettings -project iosApp.xcodeproj -scheme iosApp \
            -sdk iphonesimulator | grep -i INFOPLIST
        working-directory: iosApp
      # Simulator build only — no distribution/signing certificate exists, and none is needed to
      # verify the Xcode project + Swift/Kotlin framework integration actually builds.
      # -derivedDataPath pins the output location so the next step can find it (the default
      # DerivedData path includes a random per-checkout hash).
      - name: Build iosApp (Simulator)
        run: |
          xcodebuild -project iosApp.xcodeproj -scheme iosApp \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
        working-directory: iosApp
      # Compose Multiplatform crashes at launch if this key isn't baked into the *built* app's
      # Info.plist as true — catching that here means a bad build fails CI instead of only
      # surfacing later on a real device/simulator.
      - name: Verify CADisableMinimumFrameDurationOnPhone survived into the built app
        run: |
          PLIST=build/Build/Products/Debug-iphonesimulator/iosApp.app/Info.plist
          plutil -p "$PLIST"
          VALUE=$(/usr/libexec/PlistBuddy -c "Print :CADisableMinimumFrameDurationOnPhone" "$PLIST")
          if [ "$VALUE" != "true" ]; then
            echo "::error::CADisableMinimumFrameDurationOnPhone is '$VALUE' in the built Info.plist, expected 'true' — the app will crash at launch."
            exit 1
          fi
        working-directory: iosApp
      # Compose resources (icons/images) are only correctly copied into the app bundle by the
      # embedAndSignAppleFrameworkForXcode Run Script phase in project.yml — a prior static
      # framework-reference approach linked and ran fine but silently produced an app with no
      # compose-resources at all, crashing at runtime on the first icon/image load (confirmed live
      # via Appetize: MissingResourceException). Catching the missing directory here means CI fails
      # instead of another round-trip through a simulator.
      - name: Verify compose-resources landed in the built app
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/iosApp.app
          RES="$APP/compose-resources"
          if [ ! -d "$RES" ]; then
            echo "::error::compose-resources is missing from the built app at $RES — Compose image/icon loads will crash at runtime (MissingResourceException)."
            echo "Contents of $APP:"
            find "$APP" -maxdepth 2
            exit 1
          fi
          find "$RES" -maxdepth 4
        working-directory: iosApp
      # Lets you download iosApp.app from this run's Actions summary page and upload it straight to
      # appetize.io (or any other simulator-based tester) without a Mac — arm64-only, which matches
      # what Appetize's own docs currently recommend uploading.
      - name: Upload iOS Simulator .app
        uses: actions/upload-artifact@v4
        with:
          name: iosApp-simulator
          path: iosApp/build/Build/Products/Debug-iphonesimulator/iosApp.app
