name: iOS release

# Builds, signs and uploads the iOS app to App Store Connect (TestFlight) on a GitHub macOS runner,
# so no Mac is needed. Run it by hand: Actions -> "iOS release" -> Run workflow.
# Needs the IOS_SIGNING_BUNDLE secret, generated by scripts/ios-signing.mjs (see CLAUDE.md).

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed build to App Store Connect (untick to stop after exporting the .ipa)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

env:
  TEAM_ID: NC29559DJB
  BUNDLE_ID: com.konye.historiq
  PROFILE_NAME: Historiq App Store
  ASC_KEY_ID: 6839BBMDV4
  ASC_ISSUER_ID: 7b0970b3-14ff-46c8-8d8a-5c144284dd17

jobs:
  testflight:
    name: Archive, sign and upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # App Store Connect only accepts builds made with the iOS 26 SDK or later; failing here costs
      # seconds, failing at upload costs a full Kotlin/Native build.
      - name: Check the iOS SDK is new enough
        run: |
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK $SDK_VERSION"
          if [ "${SDK_VERSION%%.*}" -lt 26 ]; then
            echo "::error::iphoneos SDK $SDK_VERSION is older than 26, which App Store Connect rejects"
            ls -d /Applications/Xcode*
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Release (-opt) Kotlin/Native linking runs the whole-program optimizer and is far heavier than
      # the debug link ci.yml does, so the 2 GB in gradle.properties is tight. The user-level file
      # also covers the Gradle call Xcode makes later, which then reuses the same daemon.
      - name: Give Gradle more memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

      # The ad unit IDs are not secrets (they ship inside the app). They are only set here, so ci.yml's
      # builds keep Google's test units and never serve live ads.
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          echo "ADMOB_INTERSTITIAL_UNIT_ID_IOS=ca-app-pub-1835862082621920/9988562814" >> local.properties
          echo "ADMOB_REWARDED_UNIT_ID_IOS=ca-app-pub-1835862082621920/4848665203" >> local.properties

      - name: Link release framework (iosArm64)
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --stacktrace

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate iosApp.xcodeproj
        run: xcodegen generate
        working-directory: iosApp

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project iosApp.xcodeproj -scheme iosApp
        working-directory: iosApp

      - name: Install signing certificate and provisioning profile
        env:
          IOS_SIGNING_BUNDLE: ${{ secrets.IOS_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_SIGNING_BUNDLE" ]; then
            echo "::error::The IOS_SIGNING_BUNDLE repository secret is empty. Generate it with scripts/ios-signing.mjs and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          SIGNING_DIR="$RUNNER_TEMP/signing"
          mkdir -p "$SIGNING_DIR"
          echo "$IOS_SIGNING_BUNDLE" | base64 --decode | tar -xz -C "$SIGNING_DIR"

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          if curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$SIGNING_DIR/wwdr.cer"; then
            security import "$SIGNING_DIR/wwdr.cer" -k "$KEYCHAIN" || true
          fi
          security import "$SIGNING_DIR/dist.p12" -k "$KEYCHAIN" -P "$(cat "$SIGNING_DIR/p12-password.txt")" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          security find-identity -v -p codesigning "$KEYCHAIN" | tee "$RUNNER_TEMP/identities.txt"
          if ! grep -q "Apple Distribution" "$RUNNER_TEMP/identities.txt"; then
            echo "::error::No valid Apple Distribution identity after importing the certificate; all identities, valid or not:"
            security find-identity -p codesigning "$KEYCHAIN"
            exit 1
          fi

          security cms -D -i "$SIGNING_DIR/profile.mobileprovision" > "$SIGNING_DIR/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$SIGNING_DIR/profile.plist")
          INSTALLED_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$SIGNING_DIR/profile.plist")
          if [ "$INSTALLED_NAME" != "$PROFILE_NAME" ]; then
            echo "::error::The bundle's profile is named '$INSTALLED_NAME' but project.yml expects '$PROFILE_NAME'"
            exit 1
          fi
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$SIGNING_DIR/profile.mobileprovision" "$DIR/$PROFILE_UUID.mobileprovision"
          done
          echo "Installed profile '$INSTALLED_NAME' ($PROFILE_UUID), expires $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$SIGNING_DIR/profile.plist")"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$SIGNING_DIR/AuthKey.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Show resolved Release build settings
        run: |
          xcodebuild -showBuildSettings -project iosApp.xcodeproj -scheme iosApp -configuration Release -sdk iphoneos \
            | grep -E "^ +(CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|MARKETING_VERSION|CURRENT_PROJECT_VERSION|TARGETED_DEVICE_FAMILY|FRAMEWORK_SEARCH_PATHS|CODE_SIGN_ENTITLEMENTS) ="
        working-directory: iosApp

      - name: Archive
        run: |
          xcodebuild archive \
            -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
        working-directory: iosApp

      - name: Verify the archived app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/iosApp.xcarchive/Products/Applications/iosApp.app"
          PLIST="$APP/Info.plist"
          plutil -p "$PLIST" | grep -E "CFBundleIdentifier|CFBundle(Short)?Version|UIDeviceFamily|GIDClientID|GADApplicationIdentifier|ITSAppUsesNonExemptEncryption"
          codesign -dvv "$APP" 2>&1 | grep -E "Identifier=|Authority=|TeamIdentifier="
          codesign -d --entitlements - "$APP" 2>&1 || true

          if [ "$(/usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$PLIST")" != "true" ]; then
            echo "::error::CADisableMinimumFrameDurationOnPhone is not true in the built Info.plist; Compose crashes at launch without it."
            exit 1
          fi
          if [ ! -d "$APP/compose-resources" ]; then
            echo "::error::compose-resources is missing from the built app; every Compose icon/image load would crash at runtime."
            find "$APP" -maxdepth 2
            exit 1
          fi
          if [ ! -f "$APP/PrivacyInfo.xcprivacy" ]; then
            echo "::error::PrivacyInfo.xcprivacy did not reach the built app."
            find "$APP" -maxdepth 1
            exit 1
          fi
          case "$(/usr/libexec/PlistBuddy -c 'Print :GIDClientID' "$PLIST")" in
            ""|REPLACE*) echo "::error::GIDClientID is still a placeholder; Google Sign-In would fail on every device."; exit 1;;
          esac
          case "$(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' "$PLIST")" in
            ca-app-pub-3940256099942544*) echo "::error::GADApplicationIdentifier is still Google's test AdMob app ID."; exit 1;;
          esac

      - name: Export signed .ipa
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      # App Store Connect only runs its privacy-manifest checks when the build is submitted for review,
      # where a bad one turns the version into "Invalid Binary", so the same rule is applied here to
      # the exact .ipa that is about to be uploaded.
      - name: Audit the exported .ipa's privacy manifests
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ipa-contents"
          unzip -q "$RUNNER_TEMP/export/iosApp.ipa" -d "$RUNNER_TEMP/ipa-contents"
          python3 scripts/audit_privacy_manifests.py "$RUNNER_TEMP/ipa-contents/Payload/iosApp.app"

      # altool is the long-standing command-line uploader; if the runner's Xcode no longer ships it
      # or it fails, Xcode's own exportArchive upload (destination=upload) is the fallback.
      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        run: |
          IPA="$RUNNER_TEMP/export/iosApp.ipa"
          if xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"; then
            echo "Uploaded with altool."
          else
            echo "::warning::altool failed; retrying through xcodebuild -exportArchive (destination=upload)."
            sed 's#<string>export</string>#<string>upload</string>#' "$RUNNER_TEMP/ExportOptions.plist" > "$RUNNER_TEMP/ExportOptionsUpload.plist"
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptionsUpload.plist" \
              -exportPath "$RUNNER_TEMP/export-upload" \
              -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          fi
          echo "Uploaded build ${{ github.run_number }}. It appears under TestFlight once Apple has processed it, usually 10-30 minutes." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/signing" "$HOME/.appstoreconnect"
